<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer by Layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: sticky header, short intro, filter chips, responsive product grid, footer with contact. */
  :root {
    --bg: #f6f7f7;
    --surface: #ffffff;
    --fg: #14201f;
    --muted: #5b6b69;
    --line: #dde3e2;
    --accent: #0b7a6e;
    --accent-fg: #ffffff;
    --img-bg: #e8eeed;
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1615; --surface: #172120; --fg: #e8f0ee; --muted: #93a6a3;
      --line: #263331; --accent: #3fc1b0; --accent-fg: #06201c; --img-bg: #1f2c2a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1615; --surface: #172120; --fg: #e8f0ee; --muted: #93a6a3;
    --line: #263331; --accent: #3fc1b0; --accent-fg: #06201c; --img-bg: #1f2c2a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }

  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
  .btn {
    display: inline-block; font: 500 0.9rem var(--font-body); text-decoration: none; cursor: pointer;
    background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 9px 16px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .btn:focus-visible, .chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .intro { padding-block: 48px 24px; }
  .intro h1 { font-size: clamp(1.9rem, 5vw, 3rem); max-width: 18ch; }
  .intro p { color: var(--muted); max-width: 55ch; margin: 14px 0 0; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 16px 24px; }
  .chip {
    font: 500 0.85rem var(--font-body); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 20px; padding-bottom: 56px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .photo { aspect-ratio: 4 / 3; background: var(--img-bg); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs { display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto; }
  .thumbs button { flex: none; width: 52px; height: 40px; padding: 0; overflow: hidden; background: var(--img-bg); border: 2px solid transparent; border-radius: 4px; cursor: pointer; }
  .thumbs button[aria-current="true"] { border-color: var(--accent); }
  .thumbs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card h3 { font-size: 1.05rem; }
  .price { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .desc { color: var(--muted); font-size: 0.92rem; margin: 0; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .specs li { font-size: 0.75rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; }
  .card .btn { margin-top: auto; text-align: center; }
  .body .spacer { flex: 1; }

  footer { border-top: 1px solid var(--line); padding-block: 40px; }
  footer h2 { font-size: 1.4rem; }
  footer p { color: var(--muted); margin: 8px 0 16px; }
  .contacts { display: flex; flex-wrap: wrap; gap: 10px; }
  .small { font-size: 0.8rem; margin-top: 28px; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s ease; } .card:hover { transform: translateY(-2px); } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <a class="btn ghost" href="#contact">Contact</a>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1 id="headline"></h1>
    <p id="subline"></p>

  <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
  <div class="grid" id="grid"></div>
</main>

<footer id="contact">
  <div class="wrap">
    <h2>Interested in something?</h2>
    <p>Message me with the item name and I will confirm availability, colour options and delivery.</p>
    <div class="contacts" id="contacts"></div>
    <p class="small" id="note"></p>
  </div>
</footer>

const $ = (id) => document.getElementById(id);
const fmt = (n) => SHOP.currency + Number(n).toLocaleString("en-US");

function placeholder(label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
    <rect width="400" height="300" fill="#9fb3b0" fill-opacity=".35"/>
    <g stroke="#6b8581" stroke-width="2" fill="none" stroke-opacity=".8">
      <path d="M150 170 L200 140 L250 170 L200 200 Z"/><path d="M150 170 V205 L200 235 V200"/><path d="M250 170 V205 L200 235"/>
    </g>
    <text x="200" y="272" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#4f6764">${label.replace(/[<&>]/g, "")}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function inquiryLinks(name) {
  const msg = encodeURIComponent("Hi, I'm interested in the " + name + ". Is it available?");
  const out = [];
  if (SHOP.facebook) out.push({ label: "Ask on Facebook", href: SHOP.facebook });
  else if (SHOP.viber) out.push({ label: "Ask on Viber", href: `viber://chat?number=%2B${SHOP.viber}&draft=${msg}` });
  else if (SHOP.email) out.push({ label: "Ask by email", href: `mailto:${SHOP.email}?subject=${encodeURIComponent(name)}&body=${msg}` });
  return out[0];
}

function render(filter) {
  const grid = $("grid");
  grid.textContent = "";
  PRODUCTS.filter(p => filter === "All" || p.category === filter).forEach(p => {
    const card = document.createElement("article");
    card.className = "card";

    const photo = document.createElement("div");
    photo.className = "photo";
    const list = (p.images && p.images.length) ? p.images : [p.image || ""];
    const img = document.createElement("img");
    img.alt = p.name;
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    const show = (url) => {
      img.onerror = () => { img.onerror = null; img.src = placeholder(p.name); };
      img.src = url || placeholder(p.name);
    };
    show(list[0]);
    photo.appendChild(img);

    let thumbs = null;
    if (list.length > 1) {
      thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      list.forEach((url, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", p.name + " photo " + (i + 1));
        b.setAttribute("aria-current", i === 0 ? "true" : "false");
        const t = document.createElement("img");
        t.alt = "";
        t.loading = "lazy";
        t.referrerPolicy = "no-referrer";
        t.onerror = () => { t.onerror = null; t.src = placeholder(p.name); };
        t.src = url || placeholder(p.name);
        b.appendChild(t);
        b.addEventListener("click", () => {
          show(url);
          thumbs.querySelectorAll("button").forEach(x => x.setAttribute("aria-current", x === b ? "true" : "false"));
        });
        thumbs.appendChild(b);
      });
    }

    const body = document.createElement("div");
    body.className = "body";
    const row = document.createElement("div");
    row.className = "row";
    const h = document.createElement("h3"); h.textContent = p.name;
    const price = document.createElement("span"); price.className = "price"; price.textContent = fmt(p.price);
    row.append(h, price);

    const desc = document.createElement("p"); desc.className = "desc"; desc.textContent = p.desc;
    const specs = document.createElement("ul"); specs.className = "specs";
    [p.material, p.size].filter(Boolean).forEach(s => { const li = document.createElement("li"); li.textContent = s; specs.appendChild(li); });

    body.append(row, desc, specs);
    const link = inquiryLinks(p.name);
    if (link) {
      const spacer = document.createElement("div"); spacer.className = "spacer";
      const a = document.createElement("a");
      a.className = "btn"; a.href = link.href; a.textContent = link.label;
      if (link.href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
      body.append(spacer, a);
    }
    if (thumbs) card.append(photo, thumbs, body); else card.append(photo, body);
    grid.appendChild(card);
  });
}

function init() {
  document.title = SHOP.name;
  $("brand").textContent = SHOP.name;
  $("headline").textContent = SHOP.headline;
  $("subline").textContent = SHOP.subline;
  $("note").textContent = SHOP.note;

  const cats = ["All", ...new Set(PRODUCTS.map(p => p.category))];
  const box = $("filters");
  cats.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = c;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", () => {
      box.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      render(c);
    });
    box.appendChild(b);
  });

  const contacts = $("contacts");
  const add = (label, href, primary) => {
    const a = document.createElement("a");
    a.className = primary ? "btn" : "btn ghost"; a.href = href; a.textContent = label;
    if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
    contacts.appendChild(a);
  };
  if (SHOP.viber) add("Viber", "viber://chat?number=%2B" + SHOP.viber, true);
  if (SHOP.email) add("Email", "mailto:" + SHOP.email, !SHOP.viber);
  if (SHOP.facebook) add("Facebook", SHOP.facebook, false);

  render("All");
}
init();
</script>

</html>
